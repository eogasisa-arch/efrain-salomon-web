<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>His Books</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}
body{
font-family:Georgia, serif;
background:linear-gradient(to bottom,#f5f5f5,#eaeaea);
position:relative;
min-height:100vh;
}
.fade-in{
opacity:0;
transform:translateY(20px);
animation:appear 1s ease forwards;
}
@keyframes appear{
to{
opacity:1;
transform:translateY(0);
}
}
.contenedor{
text-align:center;
padding:30px 20px 40px;
}
h1{
font-size:2.6em;
margin-bottom:25px;
color:#333;
}
.libros{
display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap;
max-width:1100px;
margin:0 auto;
}
.libro{
background:white;
padding:14px 14px 18px;
border-radius:12px;
box-shadow:0 8px 20px rgba(0,0,0,0.12);
transition:0.3s;
width:240px;
display:flex;
flex-direction:column;
}
.libro:hover{
transform:translateY(-8px);
box-shadow:0 16px 32px rgba(0,0,0,0.2);
}
.libro a.img-link{
display:block;
line-height:0;
cursor:pointer;
}
.libro img{
width:100%;
height:300px;
object-fit:cover;
margin-bottom:12px;
border-radius:8px;
}
.libro h3{
margin-bottom:14px;
color:#333;
font-size:1em;
line-height:1.4;
flex:1;
min-height:48px;
}
.boton{
display:inline-block;
padding:10px 22px;
background:#caa64b;
color:black;
text-decoration:none;
border-radius:6px;
transition:0.3s;
font-size:13px;
font-weight:700;
letter-spacing:0.5px;
text-transform:uppercase;
}
.boton:hover{
transform:scale(1.05);
background:#e8c878;
}
.volver{
position:fixed;
top:20px;
left:20px;
text-decoration:none;
color:#333;
font-size:14px;
opacity:0.9;
transition:0.3s;
cursor:pointer;
z-index:9999;
padding:10px 18px;
background:rgba(255,255,255,0.85);
border-radius:8px;
border:1px solid rgba(0,0,0,0.1);
}
.volver:hover{
opacity:1;
background:#caa64b;
color:#111;
}
@media (max-width:768px){
.contenedor{padding:20px 15px 30px;}
h1{font-size:2em;margin-bottom:20px;}
.libros{gap:18px;}
.libro{width:85%;max-width:280px;padding:12px 12px 16px;}
.libro img{height:260px;}
}
@media (max-height:800px){
.contenedor{padding:20px 20px 25px;}
h1{font-size:2.2em;margin-bottom:18px;}
.libro img{height:260px;}
.libro{padding:12px 12px 14px;}
}
</style>
</head>
<body>

</div>

<h3>Footprints Along the Way<br>From Purpose to Inner Awakening</h3>

</div>

</div>

</div>

</div>

</body>
</html>
